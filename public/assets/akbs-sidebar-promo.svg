<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
<title id="title">AKBS Poultry Farming promotional illustration</title>
<desc id="desc">Premium green poultry farm scene with a white chicken, farm sheds and warm sunrise.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b5c43"/>
    <stop offset=".48" stop-color="#0a4635"/>
    <stop offset="1" stop-color="#052d24"/>
  </linearGradient>
  <radialGradient id="sun" cx=".82" cy=".16" r=".28">
    <stop offset="0" stop-color="#ffd98a" stop-opacity=".95"/>
    <stop offset=".35" stop-color="#f7b955" stop-opacity=".45"/>
    <stop offset="1" stop-color="#f7b955" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#137957"/>
    <stop offset="1" stop-color="#073a2b"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#001b14" flood-opacity=".35"/></filter>
</defs>

<rect width="600" height="360" fill="url(#bg)"/>
